<style>
/* Layout: one centred game column on a sea-coloured ground; ink-outlined paper cards with hard offset shadows, passport-stamp details in mono. */
:root{
  --sea:#ffe9b8; --paper:#fff8ea; --tile:#ffffff; --ink:#14213d; --muted:#51607a;
  --sun:#ffc533; --coral:#ff5a44; --leaf:#17a673; --on-accent:#14213d;
  --line:#14213d; --shadow:#14213d; --land:#14213d; --wave:#fbdc9a;
  --water:#7cc3ee; --ground:#f6efdc; --sky:#6cc5f0; --lilac:#c9a4f5; --stage:#14213d; --on-stage:#fff8ea; --stage-shape:#22345c; --stage-muted:#a9b9d6;
  --ok:#0a6e48; --bad:#b42318; --on-state:#ffffff;
  --f-display:'Bagel Fat One','Arial Black',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sea:#0d1a2c; --paper:#17273f; --tile:#203454; --ink:#f4eedd; --muted:#a3b3cb;
  --sun:#ffc533; --coral:#ff6b57; --leaf:#2fc48d; --on-accent:#14213d;
  --line:#6f88b3; --shadow:#04090f; --land:#f4eedd; --wave:#112239;
  --water:#2a6fb0; --ground:#2c3f60; --sky:#6cc5f0; --lilac:#c9a4f5; --stage:#0a1424; --on-stage:#fff8ea; --stage-shape:#16294a; --stage-muted:#a9b9d6; color-scheme:dark } }
:root[data-theme="dark"]{
  --sea:#0d1a2c; --paper:#17273f; --tile:#203454; --ink:#f4eedd; --muted:#a3b3cb;
  --sun:#ffc533; --coral:#ff6b57; --leaf:#2fc48d; --on-accent:#14213d;
  --line:#6f88b3; --shadow:#04090f; --land:#f4eedd; --wave:#112239;
  --water:#2a6fb0; --ground:#2c3f60; --sky:#6cc5f0; --lilac:#c9a4f5; --stage:#0a1424; --on-stage:#fff8ea; --stage-shape:#16294a; --stage-muted:#a9b9d6; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--sea);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  background-image:repeating-linear-gradient(45deg,var(--wave) 0 14px,transparent 14px 28px);background-attachment:fixed}
.app{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase}

/* title screen: dark stage with floating countries, logo, player HUD and a flag ticker */
.stage{position:relative;overflow:hidden;background:var(--stage);color:var(--on-stage);border:3px solid var(--line);border-radius:22px;
  box-shadow:6px 6px 0 var(--shadow);padding:22px 18px 0;display:flex;flex-direction:column;gap:14px;align-items:flex-start;
  background-image:radial-gradient(var(--stage-shape) 1.5px,transparent 1.6px);background-size:22px 22px}
.stage > *{position:relative}
.stage .deco{position:absolute;inset:0;pointer-events:none}
.deco .shape{position:absolute;animation:float 7s ease-in-out infinite}
.deco .shape path{fill:var(--stage-shape)}
.deco .d1{width:210px;height:210px;right:-34px;top:-30px;--r:8deg}
.deco .d2{width:130px;height:130px;right:120px;bottom:44px;--r:-10deg;animation-delay:-2.5s}
.deco .d3{width:96px;height:96px;right:14px;bottom:70px;--r:14deg;animation-delay:-4.5s}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-10px) rotate(calc(var(--r) + 3deg))}}
.stage .eyebrow{color:var(--sun)}
.stage h1{font-family:var(--f-display);font-weight:400;font-size:clamp(54px,16vw,100px);line-height:.84;margin:4px 0 22px;letter-spacing:-.01em;
  transform:rotate(-3deg);transform-origin:left center;text-shadow:4px 4px 0 var(--coral);animation:drop .5s cubic-bezier(.2,1.5,.4,1)}
.stage h1 span{display:block;color:var(--sun);padding-left:.38em}
@keyframes drop{from{transform:rotate(-3deg) translateY(-14px) scale(.94)}to{transform:rotate(-3deg)}}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.hud span{border:2px solid var(--on-stage);border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums}
.hud .rank{background:var(--sun);border-color:var(--sun);color:var(--on-accent)}
.ticker{align-self:stretch;margin-inline:-18px;overflow:hidden;border-top:3px solid var(--line);background:var(--stage-shape);padding-block:8px}
.ticker .track{display:flex;width:max-content;animation:tick 60s linear infinite}
.ticker .set{display:flex;gap:10px;padding-right:10px}
.ticker .flag{height:26px;width:auto;--bw:1.5px;border-radius:4px}
@keyframes tick{to{transform:translateX(-50%)}}

/* shared card look */
.card{background:var(--paper);border:3px solid var(--line);border-radius:18px;box-shadow:5px 5px 0 var(--shadow)}

/* home: one big start card, then the short rounds as level tiles */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.modes .label{grid-column:1/-1;margin:4px 0 -6px;color:var(--muted)}
.mode{position:relative;text-align:left;padding:0;display:flex;flex-direction:column;min-width:0;overflow:hidden;color:var(--ink);
  transition:transform .12s,box-shadow .12s;animation:pop .3s ease-out backwards;animation-delay:calc(var(--i)*55ms)}
.mode:hover{transform:translate(-2px,-3px) rotate(-.6deg);box-shadow:8px 9px 0 var(--shadow)}
.mode:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--shadow)}
.mode kbd{position:absolute;right:10px;top:10px;font-family:var(--f-mono);font-size:12px;line-height:1;padding:5px 7px;border:2px solid var(--on-accent);border-radius:7px;color:var(--on-accent)}
.mode .peek{height:84px;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--c);border-bottom:3px solid var(--line);color:var(--on-accent)}
.peek .flag{height:46px;width:auto;--fc:var(--on-accent);transform:rotate(-4deg)}
.peek .flag + .flag{transform:rotate(5deg)}
.peek .shape{height:66px;width:66px}
.peek .shape path,.mode.hero .shape path{fill:var(--on-accent)}
.peek b{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1;padding-right:34px;min-width:0;overflow-wrap:anywhere}
.mode .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.mode h2{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.05;margin:0;text-wrap:balance}
.mode p{margin:0;color:var(--muted);font-size:15px}
.mode .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.stars{font-size:20px;letter-spacing:2px;line-height:1;color:var(--coral)}
.stars i{font-style:normal;opacity:.28}
.mode.hero{grid-column:1/-1;background:var(--sun);color:var(--on-accent);flex-direction:row;align-items:center;gap:8px;padding:18px 16px}
.mode.hero .shape{width:132px;height:132px;flex:none;animation:float 6s ease-in-out infinite;--r:-6deg}
.mode.hero .body{padding:0;gap:10px}
.mode.hero h2{font-size:clamp(34px,9vw,48px)}
.mode.hero p,.mode.hero .row{color:var(--on-accent)}
.mode.hero .stars{color:var(--on-accent)}
.play{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;background:var(--coral);color:var(--on-accent);border:3px solid var(--on-accent);border-radius:999px;
  padding:8px 18px 8px 14px;font-family:var(--f-display);font-size:22px;line-height:1;box-shadow:3px 3px 0 var(--on-accent);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
@media (max-width:520px){ .modes{grid-template-columns:1fr} .mode.hero .shape{width:84px;height:84px} .deco .d2{display:none} }

/* frame drawn as an inset outline on top of the image, so no background can peek out between flag and frame */
.flag{display:block;--bw:2px;outline:var(--bw) solid var(--fc,var(--line));outline-offset:calc(-1 * var(--bw));border-radius:6px;object-fit:fill}
.shape path{fill:var(--land)}
.flag[data-c="NP"]{outline:none;border-radius:0} /* pennant on a transparent 4:3 field: no frame */

/* game */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{background:var(--paper);border:3px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:800;box-shadow:3px 3px 0 var(--shadow)}
.top h2{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.1;margin:0;flex:1 0 auto;max-width:calc(100% - 64px);overflow-wrap:anywhere}
@media (max-width:560px){.top .stats{flex-basis:100%}} /* phones: pills get their own row so the title never moves or gets covered */
.stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums}
.pill.hot{background:var(--coral);color:var(--on-accent)}
.stamps{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:26px}
.stamps .flag{height:22px;width:auto;--bw:1.5px;border-radius:4px}
.stamps .flag:nth-child(odd){transform:rotate(-4deg)} .stamps .flag:nth-child(even){transform:rotate(3deg)}
.prompt{padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.prompt .flag{height:clamp(110px,30vw,150px);width:auto;--bw:3px;border-radius:10px}
.prompt .shape{width:clamp(170px,48vw,230px);height:auto}
.prompt .big{font-family:var(--f-display);font-size:clamp(30px,8.5vw,46px);line-height:1.05;text-wrap:balance}
.prompt .q{font-weight:800;font-size:18px;margin:0;text-wrap:balance}
.prompt .say{font-size:20px;font-weight:800;text-wrap:balance}
.pop{animation:pop .22s ease-out}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:.4}to{transform:none;opacity:1}}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{position:relative;background:var(--tile);border:3px solid var(--line);border-radius:14px;box-shadow:4px 4px 0 var(--shadow);
  padding:14px 12px 14px 34px;min-height:64px;font-weight:800;font-size:17px;text-align:left;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:6px;min-width:0;overflow-wrap:anywhere;transition:transform .08s,box-shadow .08s}
.opt:not(:disabled):hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--shadow)}
.opt:not(:disabled):active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.opts.six .opt{min-height:56px}
@media (min-width:560px){.opts.six{grid-template-columns:repeat(3,minmax(0,1fr))}}
.opt kbd{position:absolute;left:10px;top:10px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.opt.vis{align-items:center;padding:26px 10px 10px}
.opt .flag{height:clamp(62px,17vw,84px);width:auto}
.opt .shape{height:clamp(84px,24vw,116px);width:auto;max-width:100%}
.opt small{font-size:14px;font-weight:600;visibility:hidden;text-align:center}
.opts.done small{visibility:visible}
/* desktop: text answers as large as the flag answers (26 + 84 flag + 6 + label 20 + 10 + borders = 152px) */
@media (min-width:720px) and (min-height:700px){.opts .opt,.opts.six .opt{min-height:152px} .opt:not(.vis){font-size:22px;padding-inline:40px 16px}}
.opt:disabled{cursor:default;color:var(--ink)}
/* answered: white text on deep green/red (contrast > 6:1 in both themes), plus a check/cross so it never relies on colour alone */
.opt.right{background:var(--ok);color:var(--on-state)} .opt.wrong{background:var(--bad);color:var(--on-state);animation:shake .25s}
.opt.right kbd,.opt.wrong kbd{color:var(--on-state)}
.opt.right .shape path,.opt.wrong .shape path{fill:var(--on-state)}
.opt.right::after,.opt.wrong::after{position:absolute;right:10px;top:8px;font:800 18px/1 var(--f-body);color:var(--on-state)}
.opt.right::after{content:'✓'} .opt.wrong::after{content:'✗'}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fb p{margin:0;font-weight:800;flex:1;min-width:0}
.go{background:var(--sun);color:var(--on-accent);border:3px solid var(--line);border-radius:12px;padding:10px 18px;font-weight:800;box-shadow:3px 3px 0 var(--shadow)}
.go:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}

/* neighbour map shown after a wrong border answer: the country in sun, its real neighbours in leaf */
.nbmap{width:min(100%,440px);height:auto;border:3px solid var(--line);border-radius:14px;background:var(--water)}
.nbmap path,.nbmap circle{stroke:var(--paper);stroke-width:1.5px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.nbmap .nb{fill:var(--leaf)} .nbmap .me{fill:var(--sun)} .nbmap .bg{fill:var(--ground)} .nbmap .bg path{stroke-width:1px}
.nbmap circle{stroke:var(--on-accent)}
.nbmap text{font:800 13px var(--f-body);fill:var(--ink);stroke:var(--paper);stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round;text-anchor:middle}
.nbmap.many text{font-size:11px}
.nbmap text.me{font-size:15.5px;fill:var(--ink)}

/* end screen: stars of this game and the journey map */
.earned{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800}
.earned .stars{font-size:34px;letter-spacing:4px}
.routemap{width:min(100%,520px);height:auto;border:3px solid var(--line);border-radius:14px;background:var(--water)}
.routemap path{stroke:var(--paper);stroke-width:1px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.routemap .bg{fill:var(--ground)} .routemap .me{fill:var(--sun)}
.routemap .route line{stroke:var(--coral);stroke-width:3px;stroke-linecap:round}
.routemap .route line.fly{stroke-dasharray:2 7}
.routemap circle{fill:var(--paper);stroke:var(--coral);stroke-width:2.5px}
.routemap circle.start{fill:var(--leaf)} .routemap circle.end{fill:var(--coral)}
.routemap text{font:800 10px var(--f-mono);fill:var(--ink);text-anchor:middle}

/* result */
.result{padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.result .stamp{border:3px double var(--coral);color:var(--coral);border-radius:10px;padding:6px 14px;transform:rotate(-4deg)}
.result .num{font-family:var(--f-display);font-size:clamp(64px,20vw,104px);line-height:.9}
.result h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0}
.result p{margin:0;color:var(--muted);font-weight:600}
.result .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.go.alt{background:var(--tile);color:var(--ink)}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="app">
  <section id="home">
    <div class="app" style="padding:0">
      <header class="stage">
        <div class="deco" id="deco" aria-hidden="true"></div>
        <h1>Grenz<span>genial</span></h1>
        <div class="hud mono" id="hud"></div>
        <div class="ticker" aria-hidden="true"><div class="track" id="ticker"></div></div>
      </header>
      <div class="modes" id="modes"></div>
    </div>
  </section>
  <section id="game" hidden>
    <div class="app" style="padding:0">
      <div class="top">
        <button class="back" id="back" aria-label="Zurück zur Auswahl">←</button>
        <h2 id="gname"></h2>
        <div class="stats mono" id="stats"></div>
      </div>
      <div class="stamps" id="stamps" hidden></div>
      <div class="card prompt" id="prompt"></div>
      <div class="opts" id="opts"></div>
      <div class="fb"><p id="fbt" aria-live="polite"></p><button class="go" id="next" hidden>Weiter ↵</button></div>
    </div>
  </section>
  <section id="end" hidden></section>
  <footer class="site-foot mono">
    <span><a href="https://falkebert.de/">Impressum: Falk Ebert</a></span>
    <a href="https://github.com/falkebert/grenzgenial">Github</a>
    <span>Kein Tracking. Rekorde nur lokal gespeichert.</span>
    <span>Flaggen: <a href="flags/LICENSE.txt">flag-icons (MIT)</a>. Karten: <a href="https://www.naturalearthdata.com/">Natural Earth</a></span>
  </footer>

    const a=P[k], m=a[0]+a[2]/2, dx=k===c?0:[0,-360,360].sort((p,q)=>Math.abs(m+p-cx)-Math.abs(m+q-cx))[0];
    return {k,a,dx,x0:a[0]+dx,y0:a[1],x1:a[0]+dx+a[2],y1:a[1]+a[3]}});
  let v=[items[0].x0,items[0].y0,items[0].x1,items[0].y1];
  for(const o of items.slice(1)){ // big neighbours are cropped to a window around the country
    const x0=Math.max(o.x0,cx-R),y0=Math.max(o.y0,cy-R),x1=Math.min(o.x1,cx+R),y1=Math.min(o.y1,cy+R);
    if(x0<x1&&y0<y1)v=[Math.min(v[0],x0),Math.min(v[1],y0),Math.max(v[2],x1),Math.max(v[3],y1)];
  }
  let w=v[2]-v[0],h=v[3]-v[1],mx=(v[0]+v[2])/2,my=(v[1]+v[3])/2; const pad=Math.max(w,h)*.07; w+=2*pad; h+=2*pad;
  if(w<h*1.15)w=h*1.15; if(w>h*1.6)h=w/1.6;
  const vx=mx-w/2, vy=my-h/2, W=420, s=W/w, H=Math.round(h*s);
  const X=x=>(x-vx)*s, Y=y=>(y-vy)*s, f=n=>+n.toFixed(2);
  const draw=(o,cls)=>{const a=o.a;
    let g=`<g class="${cls}" transform="translate(${f(X(o.x0))},${f(Y(o.y0))}) scale(${(a[2]/a[6]*s).toFixed(5)},${(a[3]/a[7]*s).toFixed(5)}) translate(${-a[4]},${-a[5]})"><path fill-rule="evenodd" d="${D[o.k].p}"/></g>`;
    if(cls!=='bg'&&Math.max(a[2],a[3])*s<9)g+=`<circle class="${cls}" cx="${f(X(o.x0+a[2]/2))}" cy="${f(Y(o.y0+a[3]/2))}" r="5"/>`;
    return g};
  const placed=[], labels=[], many=items.length>9, cw=many?6:7, lh=many?12:14;
  const order=[items[0],...items.slice(1).sort((p,q)=>p.a[9]-q.a[9])];
  for(const o of order){
    const me=o.k===c, n=D[o.k].n, tw=n.length*(me?8.6:cw)+4;
    let x=X(o.a[8]+o.dx), y=Y(o.a[9]);
    if(x<10||x>W-10||y<10||y>H-10){ // label point is cropped away: use the visible part of the box
      const x0=Math.max(X(o.x0),0),x1=Math.min(X(o.x1),W),y0=Math.max(Y(o.y0),0),y1=Math.min(Y(o.y1),H);
      if(x0>=x1||y0>=y1)continue; x=(x0+x1)/2; y=(y0+y1)/2;
    }
    x=Math.min(Math.max(x,tw/2+2),W-tw/2-2); y=Math.min(Math.max(y+5,16),H-8);
    const hit=()=>placed.some(p=>Math.abs(p.x-x)<(p.tw+tw)/2&&Math.abs(p.y-y)<lh);
    for(let i=0,y0=y;i<12&&hit();i++){const d=(i>>1)+1; y=y0+(i%2?-d:d)*lh; if(y<16||y>H-8)y=y0}
    placed.push({x,y,tw}); labels.push(`<text${me?' class="me"':''} x="${f(x)}" y="${f(y)}">${n}</text>`);
  }
  const have=new Set(items.map(o=>o.k)); let bg='';
  for(const k of K){const a=P[k]; if(!a||have.has(k))continue;
    for(const dx of [0,-360,360]){const x0=a[0]+dx,y0=a[1];
      if(x0<vx+w&&x0+a[2]>vx&&y0<vy+h&&y0+a[3]>vy){bg+=draw({k,a,dx,x0,y0},'bg')}}}
  const names=items.slice(1).map(o=>D[o.k].n).join(', ');
  return `<svg class="nbmap pop${many?' many':''}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Karte: ${D[c].n} und die Nachbarn ${names}">${bg}${items.slice(1).map(o=>draw(o,'nb')).join('')}${draw(items[0],'me')}${labels.join('')}</svg>`;
}

// whole journey on one map: visited countries in sun, the rest muted, route line through the label points (dashed = flight)
function routeMap(route){
  route=route.filter(r=>P[r.k]); if(!route.length)return '';
  const mid=a=>a[0]+a[2]/2;
  let ref=mid(P[route[0].k]); const pts=[];
  for(const r of route){ // keep the line continuous across the date line
    const a=P[r.k], dx=[0,-360,360].sort((p,q)=>Math.abs(mid(a)+p-ref)-Math.abs(mid(a)+q-ref))[0];
    pts.push({...r,a,dx}); ref=mid(a)+dx;
  }
  let v=[1e9,1e9,-1e9,-1e9];
  for(const o of pts)v=[Math.min(v[0],o.a[0]+o.dx),Math.min(v[1],o.a[1]),Math.max(v[2],o.a[0]+o.dx+o.a[2]),Math.max(v[3],o.a[1]+o.a[3])];
  let w=v[2]-v[0],h=v[3]-v[1],mx=(v[0]+v[2])/2,my=(v[1]+v[3])/2; const pad=Math.max(w,h)*.08+1.5; w+=2*pad; h+=2*pad;
  if(w<h*1.2)w=h*1.2; if(w>h*1.8)h=w/1.8;
  const vx=mx-w/2, vy=my-h/2, W=440, s=W/w, H=Math.round(h*s), X=x=>(x-vx)*s, Y=y=>(y-vy)*s, f=n=>+n.toFixed(1);
  const g=(k,a,dx,cls)=>`<g class="${cls}" transform="translate(${f(X(a[0]+dx))},${f(Y(a[1]))}) scale(${(a[2]/a[6]*s).toFixed(5)},${(a[3]/a[7]*s).toFixed(5)}) translate(${-a[4]},${-a[5]})"><path fill-rule="evenodd" d="${D[k].p}"/></g>`;
  const seen=new Set(pts.map(o=>o.k)); let bg='',fg='';
  for(const k of K){const a=P[k]; if(seen.has(k))continue;
    for(const dx of [0,-360,360])if(a[0]+dx<vx+w&&a[0]+dx+a[2]>vx&&a[1]<vy+h&&a[1]+a[3]>vy)bg+=g(k,a,dx,'bg')}
  const done=new Set(); for(const o of pts)if(!done.has(o.k)){done.add(o.k);fg+=g(o.k,o.a,o.dx,'me')}
  const xy=pts.map(o=>[f(X(o.a[8]+o.dx)),f(Y(o.a[9]))]);
  let lines=''; for(let i=1;i<xy.length;i++)lines+=`<line class="${pts[i].fly?'fly':''}" x1="${xy[i-1][0]}" y1="${xy[i-1][1]}" x2="${xy[i][0]}" y2="${xy[i][1]}"/>`;
  const many=xy.length>14;
  const dots=xy.map((p,i)=>i===0||i===xy.length-1||!many?`<circle cx="${p[0]}" cy="${p[1]}" r="${i===0||i===xy.length-1?9:7}" class="${i===0?'start':i===xy.length-1?'end':''}"/>${!many||i===0||i===xy.length-1?`<text x="${p[0]}" y="${p[1]+3.5}">${i+1}</text>`:''}`:`<circle cx="${p[0]}" cy="${p[1]}" r="3"/>`).join('');
  return `<svg class="routemap" viewBox="0 0 ${W} ${H}" role="img" aria-label="Deine Reise: ${pts.map(o=>D[o.k].n).join(', ')}">${bg}${fg}<g class="route">${lines}</g>${dots}</svg>`;
}

const MODES={
  land:{name:'Landpartie',tag:'Endlos, 3 Leben, 6 Optionen',desc:'Reise von Nachbar zu Nachbar. Jede Station fragt Flagge, Hauptstadt oder Umriss. Wer die Grenze kennt, kommt weiter.'},
  flag:{name:'Fahnenflucht',tag:'10 Fragen',desc:'Flagge sehen, Land nennen. Und umgekehrt.',n:10,gens:['flagToName','nameToFlag']},
  cap:{name:'Hauptsache Hauptstadt',tag:'10 Fragen',desc:'Vom Land zur Hauptstadt und zurück.',n:10,gens:['capital','capToCountry']},
  shape:{name:'Schattenriss',tag:'10 Fragen',desc:'Länder nur am Umriss erkennen.',n:10,gens:['shapeToName','nameToShape']},
  nb:{name:'Gute Nachbarn',tag:'10 Fragen',desc:'Wer wohnt nebenan, wer nicht?',n:10,gens:['neighbour','notNeighbour']},
  tf:{name:'Stimmt so?',tag:'12 Aussagen',desc:'Stimmt oder Quatsch. Du entscheidest.',n:12,gens:['truefalse']}
};
let best={}; try{best=JSON.parse(localStorage.getItem('grenzgenial-best'))||{}}catch(e){}
let S=null;

function show(id){for(const s of ['home','game','end'])$('#'+s).hidden=s!==id; window.scrollTo(0,0)}
const STARS={land:[100,300,600],tf:[60,125,185]}, STAR10=[50,100,150];
const starsOf=k=>(STARS[k]||STAR10).filter(t=>(best[k]||0)>=t).length;
const starRow=n=>`<span class="stars" aria-label="${n} von 3 Sternen">${'★'.repeat(n)}<i>${'★'.repeat(3-n)}</i></span>`;
const TINT={flag:'--sky',cap:'--coral',shape:'--leaf',nb:'--lilac',tf:'--sun'};
let SHOWN=new Set();
const fresh1=a=>{const f=a.filter(x=>!SHOWN.has(x));return f.length?f:a};
function home(){
  SHOWN=new Set(); const sh=c=>(SHOWN.add(c),shape(c));
  const keys=Object.keys(MODES), total=keys.reduce((a,k)=>a+(best[k]||0),0), st=keys.reduce((a,k)=>a+starsOf(k),0);
  const rank=st>=17?'Weltenbummler':st>=12?'Vielflieger':st>=6?'Interrailer':st>=1?'Tagesausflügler':'Stubenhocker';
  $('#hud').innerHTML=`<span class="rank">Rang: ${rank}</span><span>★ ${st}/18</span><span>${total} P gesamt</span>`;
  $('#deco').innerHTML=shuffle(['IT','BR','IN','AU','NO','JP','CL','GR','MX','TH']).slice(0,3).map((c,i)=>sh(c).replace('class="shape"',`class="shape d${i+1}"`)).join('');
  const set=`<div class="set">${shuffle(K).slice(0,26).map(lazyFlag).join('')}</div>`; $('#ticker').innerHTML=set+set;
  const peek={flag:flag(rnd(K))+flag(rnd(K)),cap:`<b>${D[rnd(K.filter(k=>capOK(k)&&/^[A-Za-z]+([ -][A-Za-z]+)*$/.test(D[k].c)))].c}?</b>`,shape:sh(rnd(K))+sh(rnd(K)),nb:flag('FR')+flag('ES'),tf:'<b>Stimmt? Quatsch?</b>'};
  $('#modes').innerHTML=keys.map((k,i)=>{const m=MODES[k], row=`<div class="row mono">${starRow(starsOf(k))}<span>Rekord ${best[k]||0}</span></div>`;
    return k==='land'
    ?`<button class="card mode hero" style="--i:0" data-m="${k}"><kbd>1</kbd>${sh(rnd(['IT','FR','BR','IN','AU','ZA','NO','JP']))}<div class="body"><h2>${m.name}</h2><p>${m.desc}</p><span class="play">▶ Losreisen</span>${row}</div></button><span class="mono label">Schnelle Runden</span>`
    :`<button class="card mode" style="--i:${i};--c:var(${TINT[k]})" data-m="${k}"><kbd>${i+1}</kbd><div class="peek">${peek[k]}</div><div class="body"><h2>${m.name}</h2><p>${m.desc}</p><span class="mono" style="color:var(--muted)">${m.tag}</span>${row}</div></button>`}).join('');
  show('home');
}
$('#modes').addEventListener('click',e=>{const b=e.target.closest('[data-m]'); if(b)start(b.dataset.m)});
$('#back').addEventListener('click',()=>{ if(S&&S.mode==='land'&&S.asked)finish(); else home() });

function start(mode){
  S={mode,score:0,streak:0,top:0,right:0,asked:0,lives:3,queue:[],visited:new Set(),route:[],used:new Set(),lock:false,wait:false};
  if(mode==='land'){arrive(pick(fresh1(K.filter(k=>deg(k)>=2)),k=>tierW(k)*nov(k)))}
  $('#gname').textContent=MODES[mode].name;
  $('#stamps').hidden=mode!=='land';
  show('game'); next();
}
function arrive(c,saw){ // saw: 'shape' or 'flag' was just on screen, so don't ask for it again
  S.cur=c; S.visited.add(c); S.route.push({k:c,fly:S.fly}); S.fly=0; see(c);
  const pool=[]; if(saw!=='flag')pool.push('nameToFlag'); if(saw!=='shape'&&!tiny(c))pool.push('nameToShape'); if(capOK(c))pool.push('capital');
  S.queue=shuffle(pool).slice(0,2).map(g=>()=>G[g](c));
  S.queue.push(()=>{
    const fresh=D[c].b.filter(x=>!S.visited.has(x));
    if(!fresh.length){ // dead end or island: fly anywhere, islands included
      let cand=K.filter(k=>!S.visited.has(k));
      if(!cand.length){S.visited=new Set([c]);cand=K.filter(k=>k!==c)}
      const t=pick(fresh1(cand),k=>tierW(k)*nov(k)*(deg(k)?deg(k)**-.5:.5)), byFlag=tiny(t), q=byFlag?G.flagToName(t):G.shapeToName(t);
      q.q=`${deg(c)?`Rund um ${D[c].n} kennst du schon alles`:`Von ${D[c].n} geht es nur per Flugzeug weiter`}. In welchem Land landest du?`;
      q.after=()=>{S.fly=1;arrive(t,byFlag?'flag':'shape')}; return q;
    }
    // countries with few neighbours pull harder, so dead ends like Portugal or Burundi come up more often
    const t=pick(fresh1(fresh),k=>nov(k)*deg(k)**-.8*tierW(k)**.5), q=G.neighbour(c,t);
    q.q='Weiterreise: Wer ist ein Nachbar?'; q.after=()=>arrive(t,q.sawMap&&'shape'); return q;
  });
}
function make(){
  if(S.mode==='land')return S.queue.shift()();
  const m=MODES[S.mode], cand=K.filter(k=>!S.used.has(k)&&!SHOWN.has(k));
  while(cand.length){ // important and rarely seen countries first
    const c=pick(cand,k=>tierW(k,S.mode==='shape')*nov(k));
    const q=G[m.gens[S.asked%m.gens.length]](c)||G[m.gens[0]](c);
    if(q){S.used.add(c);see(c);return q}
    cand.splice(cand.indexOf(c),1);
  }
}
function stats(){
  const m=MODES[S.mode];
  $('#stats').innerHTML=(S.mode==='land'?`<span class="pill" aria-label="${S.lives} Leben">${'♥'.repeat(S.lives)}${'♡'.repeat(3-S.lives)}</span>`
    :`<span class="pill">${Math.min(S.asked+1,m.n)}/${m.n}</span>`)
    +(S.streak>1?`<span class="pill hot">Serie ${S.streak}</span>`:'')+`<span class="pill">${S.score} P</span>`;
  if(S.mode==='land')$('#stamps').innerHTML=[...S.visited].slice(-18).map(flag).join('');
}
function next(){
  if(S.q&&S.q.after){S.q.after()}
  const m=MODES[S.mode];
  if((S.mode==='land'&&S.lives<=0)||(m.n&&S.asked>=m.n))return finish();
  const q=S.q=make(); S.lock=S.wait=false;
  stats();
  const p=$('#prompt'); p.innerHTML=q.prompt+`<p class="q">${q.q}</p>`; p.classList.remove('pop'); void p.offsetWidth; p.classList.add('pop');
  const o=$('#opts'); o.className='opts'+(q.opts.length>4?' six':'');
  o.innerHTML=q.opts.map((x,i)=>x.kind==='text'
    ?`<button class="opt" data-i="${i}"><kbd>${i+1}</kbd>${x.label}</button>`
    :`<button class="opt vis" data-i="${i}" aria-label="Antwort ${i+1}"><kbd>${i+1}</kbd>${x.kind==='flag'?flag(x.code):shape(x.code)}<small>${x.label}</small></button>`).join('');
  $('#fbt').textContent=''; $('#next').hidden=true;
}
const CHEERS=['Sitzt.','Genau.','Volltreffer.','Läuft.','Stark.','Richtig.'];
function answer(i){
  if(!S||S.lock||!S.q.opts[i])return;
  S.lock=true; S.asked++;
  const q=S.q, ok=i===q.correct, btns=[...document.querySelectorAll('.opt')];
  btns.forEach(b=>b.disabled=true); $('#opts').classList.add('done');
  btns[q.correct].classList.add('right');
  if(ok){
    S.streak++; S.right++; S.top=Math.max(S.top,S.streak);
    const gain=10+Math.min(S.streak-1,5)*2; S.score+=gain;
    $('#fbt').textContent=`${rnd(CHEERS)} +${gain}`;
    stats(); S.timer=setTimeout(next,650);
  }else{
    btns[i].classList.add('wrong'); S.streak=0; if(S.mode==='land')S.lives--;
    const a=q.opts[q.correct];
    $('#fbt').textContent=q.fact||`Richtig wäre: ${a.label}.`;
    const big=q.map&&$('#prompt .big'); if(big){big.outerHTML=nbMap(q.map);q.sawMap=1}
    stats(); S.wait=true; const n=$('#next'); n.hidden=false; n.focus();
  }
}
$('#opts').addEventListener('click',e=>{const b=e.target.closest('.opt'); if(b)answer(+b.dataset.i)});
$('#next').addEventListener('click',()=>{if(S&&S.wait)next()});
document.addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(!$('#home').hidden){
    const ks=Object.keys(MODES);
    if(e.key>='1'&&e.key<='6')start(ks[+e.key-1]);
    else if(e.key==='Enter'&&!e.target.closest('button'))start('land');
    return;
  }
  if($('#game').hidden||!S)return;
  if(e.key>='1'&&e.key<='6'){answer(+e.key-1)}
  else if((e.key==='Enter'||e.key===' ')&&S.wait){e.preventDefault();next()}
  else if(e.key==='Escape')$('#back').click();
});

// stars earned in this game, plus how far the next star is
function starsNow(k,score){
  const t=STARS[k]||STAR10, n=t.filter(x=>score>=x).length;
  return `<div class="earned">${starRow(n)}<span>${n===3?'Alle drei Sterne!':`Noch ${t[n]-score} Punkte bis zum ${n+1}. Stern`}</span></div>`;
}
function finish(){
  clearTimeout(S.timer);
  const m=MODES[S.mode], rec=S.score>(best[S.mode]||0);
  if(rec){best[S.mode]=S.score; try{localStorage.setItem('grenzgenial-best',JSON.stringify(best))}catch(e){}}
  const ratio=S.asked?S.right/S.asked:0, land=S.mode==='land', n=new Set(S.route.map(r=>r.k)).size;
  const title=land?(n>=20?'Weltenbummlerin auf Lebenszeit':n>=10?'Vielflieger':n>=5?'Interrailer':'Tagesausflug')
    :(ratio>=.9?'Weltklasse':ratio>=.7?'Vielflieger':ratio>=.4?'Pauschaltourist':'Urlaub auf Balkonien');
  $('#end').innerHTML=`<div class="card result">
    <span class="mono stamp">${rec?'Neuer Rekord':m.name}</span>
    <div class="num">${S.score}</div>
    <h2>${title}</h2>
    <p>${S.right} von ${S.asked} richtig, längste Serie ${S.top}${land?`, ${n} ${n===1?'Land':'Länder'} bereist`:''}. Rekord: ${best[S.mode]||0} Punkte.</p>
    ${starsNow(S.mode,S.score)}
    ${land?routeMap(S.route)+`<div class="stamps" style="justify-content:center">${[...new Set(S.route.map(r=>r.k))].map(flag).join('')}</div>`:''}
    <div class="btns"><button class="go" id="again">Nochmal</button><button class="go alt" id="menu">Anderes Spiel</button></div>
  </div>`;
  const mode=S.mode; S=null; show('end');
  $('#again').onclick=()=>start(mode); $('#menu').onclick=home; $('#again').focus();
}
home();
// warm the cache so flags show up instantly during play
(window.requestIdleCallback||(f=>setTimeout(f,1500)))(()=>K.forEach(c=>{new Image().src=flagSrc(c)}));
</script>
</body>
</html>
